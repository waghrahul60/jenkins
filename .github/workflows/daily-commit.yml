name: Daily Activity Commit

# ─────────────────────────────────────────────────────────────────────────────
# Schedule:  Mon–Fri, every hour from 9 AM to 10 PM IST
#            IST = UTC+5:30, so 9:00 IST = 03:30 UTC, 22:00 IST = 16:30 UTC
#            Cron fires at :30 each hour between UTC 03 and 16  → IST 09–22
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 3-16 * * 1-5'   # Mon–Fri, 03:30–16:30 UTC (09:00–22:00 IST)
  workflow_dispatch:              # Manual trigger — always commits, no gate checks

permissions:
  contents: write

jobs:
  daily-commit:
    name: Commit Gate → Maybe Commit
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python runtime ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Gate: should we commit? ────────────────────────────────────────
      #    Manual (workflow_dispatch) → ALWAYS proceed, skip gate entirely
      #    Scheduled (cron)          → run gate script (break-day + coin flip)
      - name: Run commit gate
        id: gate
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing gate, always committing"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif python .github/scripts/commit_gate.py; then
            echo "proceed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Append date+time line to abc.txt ───────────────────────────────
      - name: Update abc.txt
        if: steps.gate.outputs.proceed == 'true'
        run: |
          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')
          echo "${IST_TIME}" >> abc.txt

      # ── 5. git add abc.txt → commit → push ───────────────────────────────
      - name: Commit and push
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATETIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
          git add abc.txt
          git commit -m "chore: daily activity ${DATETIME}"
          git push origin main
